[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-openrouter"
version = "0.1.0"
description = "OpenRouter adapter for axor-core — access 200+ models through a single API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["axor", "openrouter", "llm", "agents"]
dependencies = [
    "axor-core>=0.5.0,<0.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.urls]
Repository = "https://github.com/Bucha11/axor-openrouter"

[tool.hatch.build.targets.wheel]
packages = ["axor_openrouter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
