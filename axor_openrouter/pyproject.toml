[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-openrouter"
version = "0.1.0"
description = "OpenRouter backend adapter for axor-core (Layer 1-4 integration)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "axor-core>=0.5.0,<0.6",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "anyio[trio]",
]
security = ["axor-probe", "axor-sentinel"]

[project.entry-points."axor.adapters"]
openrouter = "axor_openrouter:make_session"

[tool.hatch.build.targets.wheel]
packages = ["axor_openrouter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
